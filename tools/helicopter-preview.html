<!doctype html><html><head><meta charset="utf-8"><title>直升机涂装与旋翼检查</title><link rel="icon" href="data:,"><style>body{margin:0;background:#e9edf3}canvas{display:block}</style><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/jsm/"}}</script></head><body><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {paintHelicopter,prepareRotors} from '/aircraft.js';
